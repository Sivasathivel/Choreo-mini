name: Publish to PyPI

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already exists on PyPI
        id: pypi_check
        run: |
          pip index versions choreo-mini 2>/dev/null | grep -q "${{ steps.version.outputs.version }}" \
            && echo "exists=true" >> $GITHUB_OUTPUT \
            || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Build distributions
        if: steps.pypi_check.outputs.exists == 'false'
        run: python -m build

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Skip (version already on PyPI)
        if: steps.pypi_check.outputs.exists == 'true'
        run: |
          echo "Version ${{ steps.version.outputs.version }} already exists on PyPI — skipping publish."
          echo "Bump the version in pyproject.toml and choreo_mini/__init__.py to trigger a new release."
