[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motif-ai"
version = "0.3.0"
description = "Lightweight Python framework for multi-agent LLM workflows — MARL episode loop, LLM pool scheduling, OTEL observability, and compile-to-any-runtime."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-MotifAI-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "Sivasathivel Kandasamy" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]
keywords = [
    "llm", "agents", "agent-framework", "orchestration", "multi-agent",
    "marl", "multi-agent-reinforcement-learning", "llm-pool", "llm-routing",
    "observability", "opentelemetry", "otel", "tracing",
    "langgraph", "crewai", "autogen", "workflow", "agentic",
    "negotiation", "trade", "episode",
]
dependencies = [
    "jinja2>=3.0.0",
    "requests>=2.28.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
motif_ai = "motif_ai.cli:main"

[project.urls]
Homepage = "https://github.com/Sivasathivel/MotifAI"
Source = "https://github.com/Sivasathivel/MotifAI"
"Author LinkedIn" = "https://www.linkedin.com/in/sivasathivelkandasamy/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "langgraph",
]
tools = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]
langgraph = [
    "langgraph",
    "langchain-mcp-adapters",
]
crewai = [
    "crewai",
    "crewai-tools",
]
autogen = [
    "autogen",
    "autogen-ext",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["motif_ai", "motif_ai.*"]

[tool.setuptools.package-data]
"motif_ai" = ["templates/**/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
