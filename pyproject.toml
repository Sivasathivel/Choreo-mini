[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choreo-mini"
version = "0.2.0"
description = "A lightweight Python meta-framework for building, experimenting with, and orchestrating LLM-based agents across multiple runtimes."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Choreo-Mini-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "Sivasathivel Kandasamy" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "agents", "orchestration", "langgraph", "crewai", "autogen", "ai", "workflow", "agentic"]
dependencies = [
    "jinja2>=3.0.0",
    "requests>=2.28.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
choreo_mini = "choreo_mini.cli:main"

[project.urls]
Homepage = "https://github.com/Sivasathivel/Choreo-mini"
Source = "https://github.com/Sivasathivel/Choreo-mini"
"Author LinkedIn" = "https://www.linkedin.com/in/sivasathivelkandasamy/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "langgraph",
]
tools = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]
langgraph = [
    "langgraph",
    "langchain-mcp-adapters",
]
crewai = [
    "crewai",
    "crewai-tools",
]
autogen = [
    "autogen",
    "autogen-ext",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["choreo_mini", "choreo_mini.*"]

[tool.setuptools.package-data]
"choreo_mini" = ["templates/**/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
